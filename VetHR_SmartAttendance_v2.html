<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;background:#f0f4f8;direction:rtl;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
:root{--navy:#0f2744;--teal:#0d7377;--gold:#c9a84c;--goldt:#f0c040;--bg:#f0f4f8;--card:#fff;--border:#e2e8f0;--text:#1e293b;--sub:#64748b;--green:#059669;--red:#dc2626;--amber:#d97706;--indigo:#4f46e5;}

/* ─── SCREENS ─────────────────── */
.scr{display:none;}
.scr.on{display:flex;flex-direction:column;min-height:100vh;}

/* ─── LOGIN ─────────────────────── */
#scr-login{background:linear-gradient(145deg,#0f2744 0%,#1a3a6e 40%,#0d5c4a 100%);align-items:center;justify-content:center;padding:20px;}
.lbox{width:100%;max-width:380px;}
.lhead{text-align:center;margin-bottom:20px;}
.lhead .ico{font-size:52px;display:block;margin-bottom:6px;animation:pulse 2.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
.lhead h1{color:#fff;font-size:19px;font-weight:900;margin:0;}
.lhead .city{color:var(--goldt);font-size:13px;font-weight:700;margin-top:3px;}
.lgold{height:1.5px;background:linear-gradient(90deg,transparent,var(--gold),transparent);width:160px;margin:10px auto;}
.lhead .tagline{color:rgba(255,255,255,.6);font-size:11px;}
.lclock{text-align:center;margin-bottom:16px;background:rgba(255,255,255,.07);border-radius:14px;padding:11px 20px;border:1px solid rgba(255,255,255,.1);}
#clk-t{color:var(--goldt);font-size:26px;font-weight:700;direction:ltr;letter-spacing:2px;}
#clk-d{color:rgba(255,255,255,.6);font-size:11px;margin-top:2px;}
.lcard{background:rgba(255,255,255,.97);border-radius:20px;padding:22px;box-shadow:0 25px 60px rgba(0,0,0,.35);}
.fld{margin-bottom:12px;}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--text);margin-bottom:4px;}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:'Cairo',sans-serif;color:var(--text);background:#f8fafc;outline:none;transition:border-color .2s;}
.fld input:focus,.fld select:focus{border-color:var(--teal);}
.fld textarea{min-height:80px;resize:vertical;}
.fld input[type=date]{direction:ltr;}
.fld input[type=number]{direction:ltr;text-align:right;}
.lerr{background:#fee2e2;color:#991b1b;padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:10px;font-weight:700;text-align:center;display:none;}
.lbtn{width:100%;padding:13px;background:linear-gradient(135deg,var(--navy),var(--teal));border:none;border-radius:11px;color:#fff;font-size:15px;font-weight:900;cursor:pointer;font-family:'Cairo',sans-serif;transition:.15s;}
.lbtn:disabled{opacity:.6;cursor:not-allowed;}
.ldemo{margin-top:12px;background:#f8fafc;border-radius:10px;padding:9px 12px;font-size:11px;color:var(--sub);border:1px solid var(--border);}
.ldemo strong{color:var(--text);}
.powered-login{text-align:center;margin-top:14px;font-size:11px;color:rgba(255,255,255,.45);font-weight:600;}
.powered-login strong{color:rgba(255,255,255,.7);}

/* ─── APP ────────────────────────── */
#scr-app{background:var(--bg);}
.conn-bar{text-align:center;font-size:11px;padding:4px 0;font-weight:700;transition:all .3s;}
.cb-ok{background:#dcfce7;color:#166534;}
.cb-off{background:#fef3c7;color:#92400e;}
.topbar{background:linear-gradient(135deg,var(--navy),var(--teal));padding:10px 14px;position:sticky;top:0;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.25);}
.topbar-in{max-width:620px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;}
.tb-name{color:#fff;font-weight:900;font-size:14px;}
.tb-role{color:rgba(255,255,255,.7);font-size:10px;margin-top:1px;}
.tb-r{display:flex;align-items:center;gap:8px;}
.tb-time{color:var(--goldt);font-size:12px;font-weight:700;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--goldt);animation:blink 1s ease-in-out infinite;}

.lout-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:11px;font-family:'Cairo',sans-serif;font-weight:700;}
.content{max-width:620px;margin:0 auto;padding:14px 12px 0;}
.tab{display:none;}
.tab.on{display:block;}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;z-index:200;box-shadow:0 -3px 16px rgba(0,0,0,.09);}

.b{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;display:inline-block;}
.bg{background:#dcfce7;color:#166534;}
.br{background:#fee2e2;color:#991b1b;}
.ba{background:#fef3c7;color:#92400e;}
.bi{background:#ede9fe;color:#5b21b6;}
.bs{background:#f1f5f9;color:#475569;}
.lv{border-radius:13px;padding:13px 14px;margin-bottom:9px;border:1px solid var(--border);background:#fff;}

.pcard-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}

.pb-no{background:linear-gradient(135deg,var(--red),#b91c1c);}
.rt{width:100%;border-collapse:collapse;font-size:12px;}
.rt th{background:var(--navy);color:#fff;padding:8px 7px;text-align:center;font-weight:700;}
.rt th:first-child{text-align:right;}
.rt td{padding:8px 7px;border-bottom:1px solid #f1f5f9;text-align:center;}
.rt td:first-child{text-align:right;font-weight:700;color:var(--navy);}
.rt tr:nth-child(even) td{background:#f8fafc;}
.emp-av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--teal));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px;flex-shrink:0;}
.ol-notice{background:linear-gradient(135deg,#fffbeb,#fef9e3);border:1.5px solid #f59e0b;border-radius:14px;padding:14px;margin-bottom:12px;}
.ol-t{color:#92400e;font-weight:900;font-size:13px;margin-bottom:6px;}

.info-hint{background:#eff6ff;border-right:3px solid #3b82f6;border-radius:10px;padding:9px 12px;margin-bottom:13px;font-size:12px;color:#1d4ed8;}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:9999;padding:10px 18px;border-radius:12px;font-weight:800;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:88vw;text-align:center;display:none;pointer-events:none;}
.ts{background:#dcfce7;color:#166534;}
.te{background:#fee2e2;color:#991b1b;}
.tw{background:#fef3c7;color:#92400e;}
.powered{text-align:center;padding:10px 0 14px;font-size:11px;color:var(--sub);font-weight:600;}
.powered strong{color:var(--teal);}
</style>
</head>

function hav(a,b,c,d){const R=6371000,dL=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dl/2)**2;return Math.round(R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)));}
function wh(i,o){if(!i||!o)return null;const[h1,m1]=i.split(':').map(Number),[h2,m2]=o.split(':').map(Number),m=(h2*60+m2)-(h1*60+m1);return m>0?`${Math.floor(m/60)}س ${m%60}د`:null;}
function h(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function api(path,body){try{const r=await fetch(N8N+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(8000)});if(!r.ok)return{ok:false};return await r.json();}catch{return{ok:false};}}
function arDate(){return new Date().toLocaleDateString('ar-IQ',{weekday:'long',year:'numeric',month:'long',day:'numeric'});}
let _tt=null;
function toast(msg,t='s'){const el=document.getElementById('toast');el.textContent=msg;el.className='toast t'+t;el.style.display='block';clearTimeout(_tt);_tt=setTimeout(()=>el.style.display='none',3500);}

function startClock(){

    const ed=document.getElementById('clk-d');if(ed)ed.textContent=n.toLocaleDateString('ar-IQ',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

// ══ BADGE ════════════════════════════════════════
function bdg(st){
  const M={present:['bg','حاضر ✅'],done:['bg','اكتمل ✔'],absent:['br','غائب ❌'],leave:['ba','إجازة اعتيادية'],'timed-leave':['bi','إجازة زمنية'],approved:['bg','موافق عليها ✅'],pending:['ba','معلّقة ⏳'],rejected:['br','مرفوضة ❌'],regular:['ba','اعتيادية'],timed:['bi','زمنية']};
  const s=M[st]||['bs',st];return`<span class="b ${s[0]}">${s[1]}</span>`;
}

function showGPS(msg,cls){const el=document.getElementById('gps-msg');if(el)el.innerHTML=`<div class="gps-msg ${cls}">${msg}</div>`;}

function doCheckin(){
  const btn=document.querySelector('#gps-btns .btn-checkin');
  if(btn){btn.disabled=true;btn.textContent='⏳ جاري تحديد الموقع...';}
  showGPS('⏳ جاري تحديد موقعك الجغرافي...','gm-load');
  if(!navigator.geolocation){showGPS('❌ الجهاز لا يدعم GPS','gm-err');toast('❌ لا يدعم GPS','e');if(btn){btn.disabled=false;btn.textContent='📍 تسجيل الدخول الآن';}return;}
  navigator.geolocation.getCurrentPosition(async pos=>{
    const dist=hav(pos.coords.latitude,pos.coords.longitude,HOSP.lat,HOSP.lng);
    if(dist>HOSP.r){showGPS(`❌ خارج نطاق المستشفى — المسافة ${dist} متر (الحد: ${HOSP.r} م)`,'gm-err');toast(`❌ خارج النطاق — ${dist} م`,'e');if(btn){btn.disabled=false;btn.textContent='📍 تسجيل الدخول الآن';}return;}
    const t=T();const ex=ATT.find(a=>a.empId===CUR.id&&a.date===D());
    if(ex)ATT=ATT.map(a=>a.empId===CUR.id&&a.date===D()?{...a,checkIn:t,st:'present',dist}:a);
    else ATT.push({id:uid(),empId:CUR.id,date:D(),checkIn:t,checkOut:null,st:'present',dist});
    api('/vethr-karbala/save-attendance',{empId:CUR.id,empName:CUR.name,dept:CUR.dept,lat:pos.coords.latitude,lng:pos.coords.longitude,action:'checkin',telegramId:CUR.tg||''}).then(r=>{if(!r?.ok)toast('⚠️ سُجّل محلياً — تحقق من n8n','w');});
    showGPS(`✅ تسجيل دخول ناجح — ${t} (${dist} م من المستشفى)`,'gm-ok');
    toast(`✅ تم تسجيل الدخول — ${t}`,'s');rHome();
  },()=>{showGPS('❌ فشل تحديد الموقع — فعّل GPS','gm-err');toast('❌ فشل تحديد الموقع','e');if(btn){btn.disabled=false;btn.textContent='📍 تسجيل الدخول الآن';}},{enableHighAccuracy:true,timeout:12000});
}

async function doCheckout(){
  const t=T();ATT=ATT.map(a=>a.empId===CUR.id&&a.date===D()?{...a,checkOut:t,st:'done'}:a);
  api('/vethr-karbala/save-attendance',{empId:CUR.id,empName:CUR.name,dept:CUR.dept,lat:HOSP.lat,lng:HOSP.lng,action:'checkout',telegramId:CUR.tg||''}).then(r=>{if(!r?.ok)toast('⚠️ سُجّل محلياً','w');});

}

// ══ REPORT ═══════════════════════════════════════
function rReport(){
  const dv=document.getElementById('rep-d')?.value||D();
  const emps=USERS.filter(u=>u.role==='employee');
  const dA=ATT.filter(a=>a.date===dv),dL=LVS.filter(l=>l.s<=dv&&l.e>=dv&&l.st==='approved');
  const pres=dA.filter(a=>a.checkIn&&a.st!=='leave'&&a.st!=='timed-leave');
  const onR=dL.filter(l=>l.type==='regular'),onT=dL.filter(l=>l.type==='timed');
  const abs=emps.filter(e=>!dA.find(a=>a.empId===e.id)&&!dL.find(l=>l.empId===e.id));
  const N=emps.length,pc=n=>N?Math.round(n/N*100):0;
  const stH=[{n:pres.length,l:'حاضر',ico:'✅',c:'var(--green)'},{n:abs.length,l:'غائب',ico:'❌',c:'var(--red)'},{n:onR.length,l:'إجازة اعتيادية',ico:'📋',c:'var(--amber)'},{n:onT.length,l:'إجازة زمنية',ico:'⏱️',c:'var(--indigo)'}].map(s=>`<div class="sc"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;"><span style="font-size:20px;">${s.ico}</span><span style="font-size:11px;color:${s.c};font-weight:700;">${pc(s.n)}%</span></div><div class="sn" style="color:${s.c};">${s.n}</div><div class="sl">${s.l}</div><div class="sb"><div class="sf" style="width:${pc(s.n)}%;background:${s.c};"></div></div></div>`).join('');
  const rows=emps.map((e,i)=>{const a=dA.find(x=>x.empId===e.id),l=dL.find(x=>x.empId===e.id),st=a?.st||(l?(l.type==='regular'?'leave':'timed-leave'):'absent');return`<tr style="background:${i%2===0?'#f8fafc':'#fff'}"><td>${h(e.name)}</td><td style="font-size:10px;color:var(--sub);">${h(e.dept)}</td><td style="color:${a?.checkIn?'var(--green)':'#94a3b8'};font-weight:${a?.checkIn?700:400};direction:ltr;">${a?.checkIn||'─'}</td><td style="color:${a?.checkOut?'var(--red)':'#94a3b8'};font-weight:${a?.checkOut?700:400};direction:ltr;">${a?.checkOut||'─'}</td><td style="color:var(--teal);font-weight:700;">${wh(a?.checkIn,a?.checkOut)||'─'}</td><td>${bdg(st)}</td></tr>`;}).join('');
  document.getElementById('tab-report').innerHTML=`<div class="card"><div class="stitle"><span class="ico">📊</span>التقرير اليومي</div><div class="fld"><label>📅 اختر التاريخ</label><input type="date" id="rep-d" value="${dv}" onchange="rReport()"></div></div><div class="sg2">${stH}</div><div class="card"><div class="stitle"><span class="ico">📋</span>تفاصيل الحضور</div><div style="overflow-x:auto;"><table class="rt"><thead><tr><th>الموظف</th><th>القسم</th><th>الدخول</th><th>الخروج</th><th>ساعات</th><th>الحالة</th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="card" style="background:#f8fafc;"><div class="stitle"><span class="ico">📄</span>ملخص اليوم</div><div style="font-size:13px;line-height:2.3;"><div>📅 <strong>التاريخ:</strong> ${dv}</div><div>👥 <strong>إجمالي الموظفين:</strong> ${N}</div><div>✅ <strong>الحاضرون:</strong> ${pres.length} (${pc(pres.length)}%)</div><div>📋 <strong>إجازات اعتيادية:</strong> ${onR.length}</div><div>⏱️ <strong>إجازات زمنية:</strong> ${onT.length}</div><div>❌ <strong>الغائبون:</strong> ${abs.length}</div>${pres.length?`<div>🕐 <strong>أبكر دخول:</strong> ${[...pres].sort((a,b)=>(a.checkIn||'').localeCompare(b.checkIn||''))[0]?.checkIn||'─'}</div>`:''}</div></div>`;
}

// ══ EMPLOYEES ════════════════════════════════════
function rEmp(){
  const emps=USERS.filter(u=>u.role==='employee');
  document.getElementById('tab-emp').innerHTML=`<div class="fld" style="margin-bottom:10px;"><input id="eq" placeholder="🔍 بحث باسم الموظف..." oninput="fEmp(this.value)" style="width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:11px;font-size:14px;outline:none;font-family:'Cairo',sans-serif;background:#fff;"></div><div id="el">${buildEL(emps)}</div>`;
}
function fEmp(q){const emps=USERS.filter(u=>u.role==='employee'&&(!q||u.name.includes(q)));document.getElementById('el').innerHTML=buildEL(emps);}
function buildEL(emps){return emps.map(e=>{const a=ATT.find(x=>x.empId===e.id&&x.date===D());const pn=LVS.filter(l=>l.empId===e.id&&l.st==='pending').length;return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;"><div style="display:flex;gap:12px;align-items:center;"><div class="emp-av">${e.name.charAt(0)}</div><div><div style="font-weight:700;font-size:14px;color:var(--navy);">${h(e.name)}</div><div style="font-size:12px;color:var(--sub);">${h(e.dept)} · ${e.id}</div>${a?.checkIn?`<div style="font-size:11px;color:var(--teal);margin-top:2px;">دخل: ${a.checkIn}${a.checkOut?' — خرج: '+a.checkOut:''}</div>`:''}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">${bdg(a?.st||'absent')}${pn>0?`<span class="b ba" style="font-size:10px;">⏳ ${pn} معلّق</span>`:''}</div></div></div>`;}).join('');}

// ══ INIT ═════════════════════════════════════════
startClock();
</script>
</body>
</html>
