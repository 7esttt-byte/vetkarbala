<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SAIS">
<meta name="theme-color" content="#050d1a">
<title>SAIS — البصمة الذكية</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════ */
:root{
  --bg0:#050d1a;--bg1:#0a1628;--bg2:#0d2240;
  --teal:#00c9a7;--teal2:#00a88c;--teal3:#007a68;
  --gold:#f0c040;--gold2:#c9a84c;
  --navy:#0f2744;--navy2:#162f52;
  --glass:rgba(255,255,255,.07);
  --glass2:rgba(255,255,255,.12);
  --glass3:rgba(255,255,255,.18);
  --gstroke:rgba(255,255,255,.12);
  --gstroke2:rgba(255,255,255,.2);
  --txt:#f0f4f8;--txt2:rgba(240,244,248,.7);--txt3:rgba(240,244,248,.45);
  --green:#00e5a0;--green-bg:rgba(0,229,160,.12);
  --red:#ff4f6a;--red-bg:rgba(255,79,106,.12);
  --amber:#ffb547;--amber-bg:rgba(255,181,71,.12);
  --indigo:#7c6fef;--indigo-bg:rgba(124,111,239,.12);
  --blue:#4c9fff;--blue-bg:rgba(76,159,255,.12);
  --r:12px;--r2:18px;--r3:24px;
}

/* ═══════════════════════════════════════════
   RESET
═══════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Cairo',sans-serif;background:var(--bg0);color:var(--txt);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;color:var(--txt)}
button{cursor:pointer;border:none;outline:none}
input,textarea,select{outline:none;border:none}
a{color:inherit;text-decoration:none}

/* ═══════════════════════════════════════════
   ANIMATED BG
═══════════════════════════════════════════ */
.animated-bg{
  position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 80% 60% at 20% 10%,#0d3a6e33 0%,transparent 60%),
             radial-gradient(ellipse 70% 50% at 80% 90%,#0d7377 0%,transparent 50%),
             radial-gradient(ellipse 60% 80% at 50% 50%,#050d1a 0%,#0a1628 100%);
  animation:bgShift 12s ease-in-out infinite alternate
}
@keyframes bgShift{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(15deg)}}
#particles{position:fixed;inset:0;z-index:1;pointer-events:none}

/* ═══════════════════════════════════════════
   SCREENS
═══════════════════════════════════════════ */
.scr{display:none;min-height:100dvh;position:relative;z-index:2}
.scr.on{display:flex;flex-direction:column}

/* ═══════════════════════════════════════════
   GLASS UTILS
═══════════════════════════════════════════ */
.glass{
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--gstroke);
}
.glass2{
  background:var(--glass2);
  backdrop-filter:blur(24px) saturate(200%);
  -webkit-backdrop-filter:blur(24px) saturate(200%);
  border:1px solid var(--gstroke2);
}

/* ═══════════════════════════════════════════
   LOGIN SCREEN
═══════════════════════════════════════════ */
#s-login{align-items:center;justify-content:center;padding:24px 20px;min-height:100dvh}

.l-wrap{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:20px}

/* Logo */
.logo-ring{
  position:relative;width:90px;height:90px;
  display:flex;align-items:center;justify-content:center;
}
.logo-outer{
  position:absolute;inset:0;border-radius:50%;
  border:2px solid transparent;
  background:linear-gradient(135deg,var(--teal),var(--gold)) border-box;
  -webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:destination-out;mask-composite:exclude;
  animation:spin 8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.logo-inner{
  width:76px;height:76px;border-radius:50%;
  background:linear-gradient(135deg,#0d2240,#0d4a5e);
  border:1.5px solid var(--gstroke2);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(10px);position:relative;overflow:hidden;
}
.logo-inner::before{
  content:'';position:absolute;top:-30%;left:-30%;width:60%;height:60%;
  background:radial-gradient(circle,rgba(255,255,255,.2),transparent);
  border-radius:50%;
}
.logo-ico{font-size:30px;position:relative;z-index:1}
.logo-glow{
  position:absolute;inset:-10px;
  background:radial-gradient(circle,rgba(0,201,167,.15),transparent 70%);
  border-radius:50%;animation:glow 3s ease-in-out infinite alternate
}
@keyframes glow{0%{opacity:.5;transform:scale(.95)}100%{opacity:1;transform:scale(1.05)}}

/* Logo text */
.logo-text{text-align:center}
.logo-text h1{font-size:22px;font-weight:900;color:var(--txt);letter-spacing:.5px}
.logo-text .city{font-size:12px;color:var(--gold);font-weight:600;margin-top:2px}
.logo-gold-line{height:1.5px;width:140px;margin:8px auto 0;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}

/* Clock */
.lclock{text-align:center}
#clk{font-size:28px;font-weight:700;color:var(--gold);direction:ltr;letter-spacing:3px}
#clk-d{font-size:11px;color:var(--txt3);margin-top:3px}

/* Login card */
.lcard{
  width:100%;border-radius:var(--r3);padding:24px;
  background:rgba(13,34,64,.6);
  backdrop-filter:blur(30px) saturate(200%);
  -webkit-backdrop-filter:blur(30px) saturate(200%);
  border:1px solid var(--gstroke2);
  box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);
}
.lcard-title{font-size:14px;font-weight:700;color:var(--txt2);margin-bottom:18px;text-align:center}

/* Inputs */
.inp-wrap{position:relative;margin-bottom:12px}
.inp-ico{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.inp-f{
  width:100%;padding:11px 38px 11px 13px;
  border-radius:var(--r);
  background:rgba(255,255,255,.06);
  border:1px solid var(--gstroke);
  font-size:14px;color:var(--txt);
  transition:border-color .2s,background .2s
}
.inp-f::placeholder{color:var(--txt3)}
.inp-f:focus{border-color:var(--teal);background:rgba(255,255,255,.1)}
.inp-f[type=password]{direction:ltr;text-align:right}
.inp-f[type=text]{direction:ltr;text-align:right}
.lerr{
  background:var(--red-bg);border:1px solid rgba(255,79,106,.3);
  color:#ffa0b0;padding:8px 12px;border-radius:var(--r);
  font-size:12px;margin-bottom:12px;text-align:center;display:none
}

/* Biometric button */
.bio-btn{
  width:100%;padding:11px;border-radius:var(--r);
  background:rgba(0,201,167,.1);border:1px solid rgba(0,201,167,.25);
  color:var(--teal);font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:12px;transition:.15s;
}
.bio-btn:active{background:rgba(0,201,167,.2)}
.bio-btn.hidden{display:none}
.bio-sep{
  text-align:center;font-size:11px;color:var(--txt3);
  margin-bottom:12px;position:relative
}
.bio-sep::before,.bio-sep::after{
  content:'';position:absolute;top:50%;width:40%;height:1px;
  background:var(--gstroke)
}
.bio-sep::before{right:0}.bio-sep::after{left:0}

/* Login button */
.lbtn{
  width:100%;padding:13px;border-radius:var(--r);
  background:linear-gradient(135deg,var(--teal),var(--teal2));
  color:#fff;font-size:15px;font-weight:900;
  box-shadow:0 4px 20px rgba(0,201,167,.3);transition:.15s
}
.lbtn:disabled{opacity:.6;cursor:not-allowed}
.lbtn:not(:disabled):active{transform:scale(.98)}

/* Demo hint */
.ldemo{
  text-align:center;font-size:11px;color:var(--txt3);
  padding-top:14px;border-top:1px solid var(--gstroke);margin-top:4px
}
.ldemo strong{color:var(--txt2)}

.powered-l{text-align:center;font-size:10px;color:var(--txt3);margin-top:4px}
.powered-l strong{color:var(--teal2)}

/* ═══════════════════════════════════════════
   APP SHELL
═══════════════════════════════════════════ */
#s-app{background:transparent;min-height:100dvh}

.cbar{
  text-align:center;font-size:11px;padding:4px 0;
  font-weight:700;position:relative;z-index:10
}
.cb-ok{background:var(--green-bg);color:var(--green)}
.cb-off{background:var(--amber-bg);color:var(--amber)}

/* Top bar */
.topbar{
  background:rgba(5,13,26,.8);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--gstroke);
  padding:10px 16px;position:sticky;top:0;z-index:200;
}
.tb-in{max-width:620px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.tb-name{font-weight:900;font-size:14px;color:var(--txt)}
.tb-role{font-size:10px;color:var(--txt3);margin-top:1px}
.tb-r{display:flex;align-items:center;gap:9px}
.tb-time{color:var(--gold);font-size:12px;font-weight:700}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse2 1s ease-in-out infinite}
@keyframes pulse2{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.lout-btn{
  background:var(--glass);border:1px solid var(--gstroke);
  color:var(--txt2);padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700
}

/* Content */
.content{max-width:620px;margin:0 auto;padding:14px 12px 0}
.tab{display:none}.tab.on{display:block}

/* Bottom Nav */
.bnav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(5,13,26,.85);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--gstroke);
  display:flex;z-index:200;
  padding-bottom:env(safe-area-inset-bottom);
}
.nb{
  flex:1;background:none;display:flex;flex-direction:column;
  align-items:center;padding:8px 4px;gap:2px;position:relative;
  font-size:10px;color:var(--txt3);font-weight:500;transition:.2s
}
.nb.on{color:var(--teal)}
.nb .ico{font-size:20px;line-height:1;transition:.2s}
.nb.on .ico{font-size:22px}
.nb-bar{
  position:absolute;bottom:0;left:22%;right:22%;
  height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--teal),var(--gold));
}
.nbdg{
  position:absolute;top:4px;right:22%;
  background:var(--red);color:#fff;border-radius:50%;
  width:15px;height:15px;font-size:9px;
  display:flex;align-items:center;justify-content:center;font-weight:900
}
.pad-bot{height:80px}
.app-powered{text-align:center;padding:8px 0 14px;font-size:10px;color:var(--txt3);font-weight:600}
.app-powered strong{color:var(--teal2)}

/* ═══════════════════════════════════════════
   SHARED COMPONENTS
═══════════════════════════════════════════ */

/* Cards */
.card{
  background:rgba(13,34,64,.5);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--gstroke);
  border-radius:var(--r2);padding:16px;margin-bottom:12px;
  box-shadow:0 4px 24px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.06)
}
.hero-card{
  border-radius:var(--r3);padding:20px;margin-bottom:12px;
  background:linear-gradient(135deg,rgba(13,42,80,.8) 0%,rgba(13,77,115,.6) 50%,rgba(13,64,80,.7) 100%);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--gstroke2);
  box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1);
  overflow:hidden;position:relative
}
.hero-card::before{
  content:'';position:absolute;top:-40px;left:-40px;
  width:160px;height:160px;
  background:radial-gradient(circle,rgba(0,201,167,.08),transparent);
  border-radius:50%
}
.hero-card::after{
  content:'';position:absolute;bottom:-30px;right:-30px;
  width:120px;height:120px;
  background:radial-gradient(circle,rgba(240,192,64,.05),transparent);
  border-radius:50%
}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.hero-greet{font-size:10px;color:rgba(255,255,255,.6);margin-bottom:2px}
.hero-name{font-size:18px;font-weight:900;color:#fff}
.hero-dept{font-size:11px;color:rgba(255,255,255,.65);margin-top:3px}
.hero-stat{text-align:center;padding:10px 13px;border-radius:var(--r);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15)}
.hero-stat .si{font-size:26px}
.hero-stat .sl{font-size:10px;margin-top:3px;font-weight:700;color:rgba(255,255,255,.8)}
.hero-foot{margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:rgba(255,255,255,.65);position:relative;z-index:1}

/* Section title */
.stitle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:900;color:var(--txt);margin-bottom:12px}
.stitle .ico{font-size:17px}

/* Divider */
.divr{display:flex;align-items:center;gap:9px;margin:14px 0 10px}
.divr::before,.divr::after{content:'';flex:1;height:1px;background:var(--gstroke)}
.divr span{font-size:10px;color:var(--txt3);font-weight:700;white-space:nowrap}

/* Badges */
.badge{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;display:inline-block}
.bg{background:var(--green-bg);color:var(--green)}
.br{background:var(--red-bg);color:var(--red)}
.ba{background:var(--amber-bg);color:var(--amber)}
.bi{background:var(--indigo-bg);color:var(--indigo)}
.bs{background:rgba(255,255,255,.08);color:var(--txt3)}

/* Stats grids */
.sg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sg2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.sc{
  background:rgba(13,34,64,.6);border:1px solid var(--gstroke);
  border-radius:var(--r);padding:12px 9px;text-align:center;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)
}
.sc .si{font-size:20px;margin-bottom:3px}
.sc .sn{font-size:22px;font-weight:900;line-height:1}
.sc .sl{font-size:9px;color:var(--txt3);margin-top:2px}
.sc .sb{height:3px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:7px}
.sc .sf{height:100%;border-radius:3px;transition:width .4s}

/* Form elements */
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:4px}
.fld input,.fld select,.fld textarea{
  width:100%;padding:10px 13px;border-radius:var(--r);
  background:rgba(255,255,255,.06);border:1px solid var(--gstroke);
  font-size:14px;color:var(--txt);transition:border-color .2s,background .2s
}
.fld input::placeholder,.fld textarea::placeholder{color:var(--txt3)}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--teal);background:rgba(255,255,255,.1)}
.fld textarea{min-height:76px;resize:none}
.fld input[type=date]{direction:ltr}
.fld input[type=number]{direction:ltr;text-align:right}
.fld select option{background:#0d2240;color:var(--txt)}

/* Buttons */
.btn{display:block;width:100%;padding:12px;border-radius:var(--r);font-size:14px;font-weight:900;color:#fff;transition:.15s;text-align:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:not(:disabled):active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--teal),var(--teal2));box-shadow:0 4px 16px rgba(0,201,167,.25)}
.btn-checkin{background:linear-gradient(135deg,var(--teal),var(--teal3));box-shadow:0 4px 16px rgba(0,201,167,.2)}
.btn-checkout{background:linear-gradient(135deg,var(--red),#c0304a);box-shadow:0 4px 16px rgba(255,79,106,.2);margin-top:8px}
.btn-navy{background:linear-gradient(135deg,rgba(13,42,80,.9),rgba(13,64,90,.9));border:1px solid var(--gstroke2)}
.btn-amber{background:linear-gradient(135deg,var(--gold2),#a08030)}

/* Info hint */
.info-hint{
  background:rgba(76,159,255,.1);border-right:3px solid var(--blue);
  border-radius:var(--r);padding:9px 12px;margin-bottom:12px;
  font-size:12px;color:rgba(76,159,255,.9)
}

/* Done box */
.done-box{
  text-align:center;padding:13px;
  background:var(--green-bg);border-radius:var(--r);
  color:var(--green);font-weight:900;font-size:13px;
  border:1px solid rgba(0,229,160,.2)
}

/* GPS */
.gps-msg{border-radius:var(--r);padding:9px 13px;font-size:12px;margin-bottom:10px;font-weight:600;border-right:3px solid}
.gm-ok{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.gm-err{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.gm-load{background:rgba(76,159,255,.1);color:var(--blue);border-color:var(--blue)}
.cin-box{background:var(--green-bg);border:1px solid rgba(0,229,160,.2);border-radius:var(--r);padding:10px 13px;margin-bottom:10px;font-size:12px}
.cin-t{color:var(--green);font-weight:900;font-size:12px;margin-bottom:3px}
.gps-note{font-size:10px;color:var(--txt3);text-align:center;margin-top:8px}

/* On leave */
.ol-notice{background:rgba(255,181,71,.08);border:1px solid rgba(255,181,71,.25);border-radius:var(--r2);padding:13px;margin-bottom:11px}
.ol-t{color:var(--amber);font-weight:900;font-size:12px;margin-bottom:5px}
.ol-d{font-size:11px;color:rgba(255,181,71,.85);background:rgba(255,255,255,.04);padding:7px 10px;border-radius:9px;margin-top:4px;border-right:3px solid var(--amber)}

/* Leave items */
.lv{background:rgba(13,34,64,.5);border:1px solid var(--gstroke);border-radius:var(--r2);padding:13px;margin-bottom:9px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lv-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px}
.lv-type{font-weight:700;font-size:13px;color:var(--txt)}
.lv-when{font-size:10px;color:var(--txt3);margin-top:2px}
.lv-rsn{font-size:12px;color:var(--txt2);background:rgba(255,255,255,.04);padding:7px 10px;border-radius:9px;margin-bottom:6px;border-right:3px solid var(--gstroke)}
.lv-meta{font-size:10px;color:var(--txt3);display:flex;gap:13px;flex-wrap:wrap}

/* Approve cards */
.pcard{background:rgba(255,181,71,.06);border:1px solid rgba(255,181,71,.2);border-radius:var(--r2);padding:14px;margin-bottom:9px}
.pcard-n{font-weight:900;font-size:14px;color:var(--txt)}
.pcard-d{font-size:10px;color:var(--txt3);margin-top:2px}
.pcard-b{font-size:12px;color:var(--txt2);background:rgba(255,255,255,.04);padding:9px 11px;border-radius:var(--r);margin:9px 0;line-height:1.8}
.apbtns{display:flex;gap:9px}
.apbtns button{flex:1;padding:9px;border:none;border-radius:var(--r);font-weight:900;font-size:12px;color:#fff}
.pb-ok{background:linear-gradient(135deg,var(--green),#00a875);box-shadow:0 2px 10px rgba(0,229,160,.2)}
.pb-no{background:linear-gradient(135deg,var(--red),#c0304a);box-shadow:0 2px 10px rgba(255,79,106,.2)}

/* Sent success */
.sent-ok{text-align:center;padding:28px;background:var(--green-bg);border-radius:var(--r2);border:1px solid rgba(0,229,160,.2);margin-bottom:11px}

/* Empty */
.empty{text-align:center;padding:28px;color:var(--txt3)}
.empty .ei{font-size:40px;margin-bottom:8px}

/* Report table */
.rt{width:100%;border-collapse:collapse;font-size:11px}
.rt th{background:rgba(13,42,80,.9);color:var(--txt);padding:8px 6px;text-align:center;font-weight:700;border-bottom:1px solid var(--gstroke)}
.rt th:first-child{text-align:right}
.rt td{padding:8px 6px;border-bottom:1px solid var(--gstroke);text-align:center;color:var(--txt2)}
.rt td:first-child{text-align:right;font-weight:700;color:var(--txt);font-size:11px}
.rt tr:nth-child(even) td{background:rgba(255,255,255,.02)}

/* Employee avatar */

/* ═══════════════════════════════════════════

═══════════════════════════════════════════ */
function initParticles(){
  const canvas=document.getElementById('particles');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});
  const particles=Array.from({length:40},()=>({
    x:Math.random()*canvas.width, y:Math.random()*canvas.height,
    r:Math.random()*1.5+.5, vx:(Math.random()-.5)*.3, vy:(Math.random()-.5)*.3,
    a:Math.random()*.4+.05
  }));
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(0,201,167,${p.a})`; ctx.fill();
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>canvas.width) p.vx*=-1;
      if(p.y<0||p.y>canvas.height) p.vy*=-1;
    });
    requestAnimationFrame(draw);
  }
  draw();
}

/* ═══════════════════════════════════════════
   BIOMETRIC (WebAuthn — Face ID / Touch ID)
═══════════════════════════════════════════ */
const BIO = {
  RP_ID: location.hostname || 'localhost',
  CRED_KEY: 'sais_bio_cred',
  USER_KEY: 'sais_bio_user',

  async isAvailable(){
    if(!window.PublicKeyCredential) return false;
    try{ return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
    catch{ return false; }
  },

  rand(n=32){ return crypto.getRandomValues(new Uint8Array(n)); },

  b64(arr){ return btoa(String.fromCharCode(...new Uint8Array(arr))); },
  unb64(s){ return new Uint8Array(atob(s).split('').map(c=>c.charCodeAt(0))); },

  async register(user){
    try{
      const cred = await navigator.credentials.create({ publicKey:{
        challenge: this.rand(),
        rp:{ name:'SAIS — البصمة الذكية', id:this.RP_ID },
        user:{ id:new TextEncoder().encode(user.id), name:user.username, displayName:user.name },
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
        authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
        timeout:60000
      }});
      if(!cred) return false;
      localStorage.setItem(this.CRED_KEY, this.b64(cred.rawId));
      localStorage.setItem(this.USER_KEY, JSON.stringify(user));
      return true;
    }catch(e){ console.log('Bio register:',e.message); return false; }
  },

  async authenticate(){
    const credB64 = localStorage.getItem(this.CRED_KEY);
    const userStr = localStorage.getItem(this.USER_KEY);
    if(!credB64 || !userStr) return null;
    try{
      const rawId = this.unb64(credB64);
      const assertion = await navigator.credentials.get({ publicKey:{
        challenge: this.rand(),
        allowCredentials:[{type:'public-key',id:rawId,transports:['internal']}],
        userVerification:'required',
        timeout:60000
      }});
      if(!assertion) return null;
      return JSON.parse(userStr);
    }catch(e){ console.log('Bio auth:',e.message); return null; }
  },

  clear(){
    localStorage.removeItem(this.CRED_KEY);
    localStorage.removeItem(this.USER_KEY);
  }
};

async function initBiometric(){
  const avail = await BIO.isAvailable();
  if(!avail) return;
  const hasCredential = !!localStorage.getItem(BIO.CRED_KEY);
  const btn = document.getElementById('bio-btn');
  const sep = document.getElementById('bio-sep');
  if(hasCredential && btn){
    btn.classList.remove('hidden');
    sep.style.display = 'block';

    document.getElementById('bio-lbl').textContent = isFace ? 'تسجيل الدخول ببصمة الوجه (Face ID)' : 'تسجيل الدخول بالبصمة';
  }
}

  const btn=document.getElementById('bio-btn');

async function offerBiometric(user){

  if(confirm('هل تريد تفعيل تسجيل الدخول ببصمة الوجه / البصمة للمرات القادمة؟')){

  const err=document.getElementById('lerr');

  btn.disabled=true; btn.textContent='⏳ جاري التحقق...'; err.style.display='none';
  let user=null;
  const r = await post(DATA.login,{username:u,password:p});
  if(r?.ok && r?.user) user=r.user;
  else user=LOCAL_USERS.find(x=>x.username===u&&x.password===p)||null;
  if(user){
    onLoginSuccess(user);
    offerBiometric(user);
  } else {
    err.textContent='❌ اسم المستخدم أو كلمة المرور غير صحيحة';
    err.style.display='block'; btn.disabled=false; btn.textContent='دخول إلى النظام';

    `<button class="nb${t.id===TAB?' on':''}" id="nb-${t.id}" onclick="sw('${t.id}')">
       <span class="ico">${t.ico}</span>${t.l}
       ${t.b?`<span class="nbdg" id="nb-bdg" style="display:none">0</span>`:''}
       ${t.id===TAB?'<div class="nb-bar"></div>':''}
     </button>`
  ).join('');
  updBdg();
}

function updBdg(){
  const n=LVS.filter(l=>l.st==='pending').length;
  const el=document.getElementById('nb-bdg');
  if(el){ el.textContent=n; el.style.display=n>0?'flex':'none'; }
}

function sw(id){
  TAB=id;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b=>{
    b.classList.remove('on');
    const bar=b.querySelector('.nb-bar'); if(bar) bar.remove();
  });
  const t=document.getElementById('tab-'+id); if(t){ t.classList.add('on'); t.classList.add('fade-in'); }
  const nb=document.getElementById('nb-'+id);
  if(nb){ nb.classList.add('on'); nb.insertAdjacentHTML('beforeend','<div class="nb-bar"></div>'); }
  renderTab(id);
}

function renderTab(id){
  const R={home:rHome,leave:rLeave,myleaves:rMyLeaves,approve:rApprove,report:rReport,emp:rEmp};
  if(R[id]) R[id]();
}

/* GPS helpers */
function showGPS(msg,cls){
  const el=document.getElementById('gps-msg');
  if(el) el.innerHTML=`<div class="gps-msg ${cls}">${msg}</div>`;
}

/* ── CHECK-IN → WH.checkin ── */
function doCI(){
  const btn=document.querySelector('#gps-btns .btn-checkin');
  if(btn){btn.disabled=true;btn.textContent='⏳ جاري تحديد الموقع...';}
  showGPS('⏳ جاري تحديد موقعك الجغرافي...','gm-load');
  if(!navigator.geolocation){
    showGPS('❌ الجهاز لا يدعم GPS','gm-err');
    toast('❌ الجهاز لا يدعم تحديد الموقع','e');
    if(btn){btn.disabled=false;btn.textContent='📍 تسجيل الدخول الآن';}
    return;
  }
  navigator.geolocation.getCurrentPosition(async pos=>{
    const dist=hav(pos.coords.latitude,pos.coords.longitude,CFG.hosp.lat,CFG.hosp.lng);
    if(dist>CFG.hosp.r){
      showGPS(`❌ خارج نطاق المستشفى — المسافة ${dist} متر (الحد: ${CFG.hosp.r} م)`,'gm-err');
      toast(`❌ خارج النطاق — ${dist} م`,'e');
      if(btn){btn.disabled=false;btn.textContent='📍 تسجيل الدخول الآن';}
      return;
    }
    const t=T(), d=D();
    /* Update local state */
    const ex=ATT.find(a=>a.empId===CUR.id&&a.date===d);
    if(ex) ATT=ATT.map(a=>a.empId===CUR.id&&a.date===d?{...a,checkIn:t,st:'present',dist}:a);
    else   ATT.push({id:uid(),empId:CUR.id,date:d,checkIn:t,checkOut:null,st:'present',dist});
    /* ── POST to WH.checkin ── */
    const payload={
      empId:CUR.id, empName:CUR.name, dept:CUR.dept,
      lat:pos.coords.latitude, lng:pos.coords.longitude,
      distance:dist, action:'checkin',
      timeStr:t, dateStr:d, telegramId:CUR.tg||''
    };
    const res=await post(WH.checkin,payload);
    showGPS(`✅ تسجيل دخول ناجح — ${t} · ${dist} م من المستشفى`,'gm-ok');
    toast(`✅ دخول مسجَّل — ${t}`,'s');
    if(!res?.ok) toast('⚠️ أضف Google Sheets credential في n8n','w');
    rHome();
  },()=>{
    showGPS('❌ فشل تحديد الموقع — فعّل GPS وأعد المحاولة','gm-err');
    toast('❌ فشل تحديد الموقع','e');
    if(btn){btn.disabled=false;btn.textContent='📍 تسجيل الدخول الآن';}
  },{enableHighAccuracy:true,timeout:12000});
}

/* ── CHECK-OUT → WH.checkout ── */
async function doCO(){
  const t=T(), d=D();
  ATT=ATT.map(a=>a.empId===CUR.id&&a.date===d?{...a,checkOut:t,st:'done'}:a);
  /* POST to WH.checkout */
  const payload={
    empId:CUR.id, empName:CUR.name, dept:CUR.dept,
    lat:CFG.hosp.lat, lng:CFG.hosp.lng,
    action:'checkout', timeStr:t, dateStr:d, telegramId:CUR.tg||''
  };
  const res=await post(WH.checkout,payload);
  toast(`✅ خروج مسجَّل — ${t}`,'s');
  if(!res?.ok) toast('⚠️ أضف Google Sheets credential في n8n','w');
  rHome();
}

/* ── SUBMIT LEAVE → WH.leaveReq ── */
async function submitLeave(){
  const type=document.getElementById('lt').value;
  const s=document.getElementById('ls').value;
  const e=document.getElementById('le')?.value||s;
  const hrs=document.getElementById('lh')?.value||'2';
  const rsn=document.getElementById('lr').value.trim();
  if(!rsn){toast('⚠️ أدخل سبب الإجازة','w');return;}
  if(type==='timed'&&(+hrs<1||+hrs>8)){toast('⚠️ الساعات يجب بين 1 و 8','w');return;}
  const btn=document.getElementById('lbtn2');
  btn.disabled=true; btn.textContent='⏳ جاري الإرسال...';
  const lv={
    id:uid(), empId:CUR.id, type,
    s, e:type==='timed'?s:e,
    hrs:type==='timed'?+hrs:null,
    rsn, st:'pending', at:D()+' '+T()
  };
  /* ── POST to WH.leaveReq ── */
  const payload={
    ...lv,
    leaveId:lv.id, empName:CUR.name, dept:CUR.dept,
    startDate:lv.s, endDate:lv.e, hours:lv.hrs,
    reason:lv.rsn, reqAt:lv.at, telegramId:CUR.tg||''
  };
  const res=await post(WH.leaveReq,payload);
  LVS.push(lv); updBdg();
  const saved=res?.ok;
  document.getElementById('tab-leave').innerHTML=`
  <div class="sent-ok">
    <div style="font-size:48px;margin-bottom:10px">📨</div>
    <div style="font-size:16px;font-weight:900;color:var(--green);margin-bottom:8px">تم إرسال طلبك بنجاح!</div>
    <div style="font-size:12px;color:var(--txt3);margin-bottom:20px">${saved
      ?'✅ تم الحفظ في Google Sheets وإشعار المدير عبر Telegram'
      :'⚠️ سُجّل محلياً — تحقق من Google Sheets credential في n8n'}</div>
    <button class="btn btn-primary" onclick="rLeave()">📝 طلب إجازة جديدة</button>
  </div>`;
  toast(saved?'✅ محفوظ في Google Sheets':'⚠️ سُجّل محلياً',saved?'s':'w');
}

async function actL(id,ok){

  const payload={
    leaveId:id, action:ok?'approve':'reject',

  const res=await post(WH.leaveAct,payload);
  LVS=LVS.map(l=>l.id!==id?l:{...l,st:ok?'approved':'rejected',by:CUR.id,bat:D()+' '+T()});

═══════════════════════════════════════════ */
function rEmp(){
  const emps=USERS.filter(u=>u.role==='employee');
  document.getElementById('tab-emp').innerHTML=`
  <div class="fld" style="margin-bottom:10px">
    <input id="eq" placeholder="🔍 بحث باسم الموظف..." oninput="fEmp(this.value)"
      style="width:100%;padding:10px 13px;border-radius:var(--r);background:rgba(255,255,255,.06);border:1px solid var(--gstroke);font-size:13px;color:var(--txt)">
  </div>
  <div id="el">${buildEL(emps)}</div>`;
}

function fEmp(q){
  const emps=USERS.filter(u=>u.role==='employee'&&(!q||u.name.includes(q)));
  document.getElementById('el').innerHTML=buildEL(emps);
}

function buildEL(emps){
  return emps.map(e=>{
    const a=ATT.find(x=>x.empId===e.id&&x.date===D());
    const pn=LVS.filter(l=>l.empId===e.id&&l.st==='pending').length;
    return`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="display:flex;gap:11px;align-items:center">
          <div class="emp-av">${e.name.charAt(0)}</div>
          <div>
            <div style="font-weight:700;font-size:13px;color:var(--txt)">${h(e.name)}</div>
            <div style="font-size:11px;color:var(--txt3)">${h(e.dept)} · ${e.id}</div>
            ${a?.checkIn?`<div style="font-size:10px;color:var(--teal);margin-top:2px">دخل: ${a.checkIn}${a.checkOut?' — خرج: '+a.checkOut:''}</div>`:''}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          ${bdg(a?.st||'absent')}
          ${pn>0?`<span class="badge ba" style="font-size:9px">⏳ ${pn} معلّق</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
initParticles();
startClock();
initBiometric();

/* PWA Service Worker */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
